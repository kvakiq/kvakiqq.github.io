<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAPTER kvakiq</title>
    <style>
        /* Базовые настройки и красивый градиент на фоне */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Контейнер-карточка */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 340px;
            backdrop-filter: blur(10px);
        }

        /* Круглая аватарка */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        /* Имя и подпись */
        h1 {
            font-size: 22px;
            color: #2d3748;
            margin: 0 0 5px 0;
        }
        .subtitle {
            font-size: 14px;
            color: #718096;
            margin: 0 0 25px 0;
        }

        /* Стильные кнопки-ссылки */
        .link-btn {
            display: block;
            margin-bottom: 12px;
            padding: 14px;
            background: #fff;
            color: #4a5568;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            border: 2px solid #e2e8f0;
        }

        /* Эффект при наведении */
        .link-btn:hover {
            background: #764ba2;
            color: #fff;
            border-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ссылка на вашу аватарку (можно из GitHub или соцсети) -->
        <img class="avatar" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9UsFOOWdzbD7eVY4LJDkigodHIhjI3MMKr0iPoLHpQQ&s=10" alt="Аватар">
        
        <h1>kvakiq</h1>
        <p class="subtitle">Нажми на кнопки ниже</p>

        <!-- Блок ссылок -->
        <a class="link-btn" href="https://t.me/kvakiq" target="_blank">Telegram</a>
        <a class="link-btn" href="https://vk.com/kvakiq" target="_blank">ВКонтакте</a>
    </div>

</body>
</html>
