<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя визитка</title>
    <!-- Подключаем иконки соцсетей и тем -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Базовые переменные для тем оформления */
        :root {
            /* Темная тема (по умолчанию) */
            --bg-color-1: #0a0a0a;
            --bg-color-2: #1a0505;
            --bg-color-3: #3a0007;
            --bg-color-4: #120002;
            --card-bg: rgba(20, 20, 25, 0.8);
            --card-border: rgba(255, 0, 0, 0.15);
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --btn-bg: rgba(39, 39, 42, 0.6);
            --tree-color: rgba(30, 5, 5, 0.4);
            --toggle-text-color: rgba(255, 255, 255, 0.7);
        }

        [data-theme="light"] {
            /* Светлая тема */
            --bg-color-1: #f5f7fa;
            --bg-color-2: #eddcd9;
            --bg-color-3: #fbe8e7;
            --bg-color-4: #e0f2fe;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(239, 68, 68, 0.2);
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --btn-bg: rgba(243, 244, 246, 0.8);
            --tree-color: rgba(200, 180, 180, 0.3);
            --toggle-text-color: rgba(31, 41, 55, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            
            /* Динамический фон через CSS-переменные */
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), var(--bg-color-4), var(--bg-color-1));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
            overflow: hidden;
            transition: color 0.4s ease;
        }

        /* Анимация переливания фоновых цветов */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Силуэты деревьев на фоне (векторная графика) */
        .forest-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            fill: var(--tree-color);
            z-index: 1;
            pointer-events: none;
            transition: fill 0.4s ease;
        }

        /* Контейнер для падающего снега */
        #snow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        [data-theme="light"] .snowflake {
            color: #93c5fd; /* В светлой теме снежинки слегка голубоватые */
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Блок управления темой в верхнем правом углу */
        .theme-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        /* Стили для текстовой надписи переключателя */
        .theme-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--toggle-text-color);
            user-select: none;
            transition: color 0.4s ease;
        }

        /* Кнопка переключения темы */
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.4s ease;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        /* Карточка профиля */
        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 340px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--card-border);
            z-index: 5;
            animation: fadeInUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Аватарка */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-main);
            margin: 0 0 8px 0;
            font-weight: 700;
            transition: color 0.4s ease;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0 0 30px 0;
            transition: color 0.4s ease;
        }

        /* Кнопки-ссылки */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
            padding: 14px;
            background: var(--btn-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-btn i { transition: transform 0.3s ease; }
        .link-btn:hover { transform: translateY(-3px); }
        .link-btn:hover i { transform: scale(1.1); }

        /* Цвета брендов при наведении */
        .tg-btn:hover {
            background: #24A1DE;
            box-shadow: 0 6px 20px rgba(36, 161, 222, 0.4);
            border-color: #24A1DE;
            color: #fff;
        }
        .vk-btn:hover {
            background: #0077FF;
            box-shadow: 0 6px 20px rgba(0, 119, 255, 0.4);
            border-color: #0077FF;
            color: #fff;
        }

        .link-btn:last-child { margin-bottom: 0; }
    </style>
</head>
<body>

    <!-- Блок смены темы -->
    <div class="theme-container">
        <span class="theme-text" id="theme-text">Переключить тему на светлую</span>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
            <i class="fas fa-moon" id="theme-icon"></i>
        </button>
    </div>

    <!-- Контейнер для эффекта снега -->
    <div id="snow-container"></div>

    <!-- Силуэт леса на фоне -->
    <svg class="forest-bg" viewBox="0 0 1200 180" preserveAspectRatio="none">
        <path d="M0,180 L1200,180 L1200,120 L1150,140 L1100,110 L1050,130 L1000,90 L950,120 L900,100 L850,130 L800,85 L750,115 L700,95 L650,125 L600,80 L550,110 L500,90 L450,120 L400,85 L350,115 L300,95 L250,130 L200,90 L150,120 L100,100 L50,135 L0,110 Z"/>
    </svg>

    <!-- Основная карточка визитки -->
    <div class="card">
        <img class="avatar" src="https://github.com" alt="Аватар">
        <h1>Ваше Имя</h1>
        <p class="subtitle">Краткое описание профиля</p>

        <a class="link-btn tg-btn" href="https://t.me" target="_blank">
            <i class="fab fa-telegram fa-lg"></i> Telegram
        </a>
        
        <a class="link-btn vk-btn" href="https://vk.com" target="_blank">
            <i class="fab fa-vk fa-lg"></i> ВКонтакте
        </a>
    </div>

    <!-- Скрипт для работы снега и смены тем -->
    <script>
        function toggleTheme() {
            const documentElement = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            if (documentElement.getAttribute('data-theme') === 'light') {
                documentElement.removeAttribute('data-theme');
                icon.className = 'fas fa-moon';
                text.innerText = 'Переключить тему на светлую';
            } else {
                documentElement.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-sun';
                text.innerText = 'Переключить тему на тёмную';
            }
        }

        // --- ГЕНЕРАТОР ПАДАЮЩЕГО СНЕГА ---
        const snowContainer = document.getElementById('snow-container');
        const snowflakesCount = 40;
